logging:
  level: info
  format: json

server:
  addr: :8080
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 10s

cache:
  max_size_bytes: 104857600
  ttl: 5s

upstream:
  dial_timeout: 30s
  keep_alive_probes: 30s
  disable_keep_alives: false

  max_idle_conns: 100
  max_idle_conns_per_host: 100
  max_conns_per_host: 100
  idle_conn_timeout: 90s

proxy:
  - path: "/data"
    strategy: round_robin
    upstreams:
      - url: "http://httpbin.org"
        weight: 1
      - url: "http://httpbingo.org"
        weight: 2
    middlewares:
      - strip_prefix:
          prefix: "/data"
      - logger: {}
      - geoip: {}

  - path: "/ip"
    upstreams:
      - url: "http://httpbingo.org"
    middlewares:
      - logger: {}
      - http_cache:
          ttl: 10s

  - path: "/whoami"
    upstreams:
      - url: "http://whoami.localhost:8888"
    middlewares:
      - strip_prefix:
          prefix: "/whoami"
      - logger: {}
      - geoip: {}

