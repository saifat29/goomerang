logging:
  level: info
  format: json

server:
  addr: :8080
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 60s

cache:
  max_size_bytes: 104857600
  ttl: 5s

upstream:
  dial_timeout: 30s
  keep_alive_probes: 30s
  disable_keep_alives: false

  max_idle_conns: 100
  max_idle_conns_per_host: 100
  max_conns_per_host: 100
  idle_conn_timeout: 90s

proxy:
  - path: "/json"
    upstream: "http://httpbin.org"
    middlewares:
      - logger: {}
      - http_cache:
          ttl: 3s

  - path: "/ip"
    upstream: "http://httpbingo.org"
    middlewares:
      - logger: {}
      - http_cache:
          ttl: 10s
